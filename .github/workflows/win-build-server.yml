name: win-build-server

# Baut den Windows-NSIS-Installer der Pulse-SERVER-App (App-Hosting) samt
# Auto-Update-Artefakten. Installer + Blockmap gehen als GitHub-Release raus
# (feste Dateinamen); der Update-Feed `latest.yml` liegt per scp auf dem Cloud-VPS,
# von wo nginx ihn unter https://howispulse.com/updates/win-server/ ausliefert —
# dort pollt ihn electron-updater in der Server-App —, und seine Adressen zeigen
# auf das Release. Installer, Blockmap und die -latest-Kopie liegen zusätzlich
# als Rückfall auf dem VPS.
#
# Gegenstück zu win-build.yml (Client-Installer), aber ohne FFmpeg/HQ-Sidecar
# — die Server-App streamt nicht selbst. Seit 0.1.92 ist das NATIVE Backend
# der Windows-Default (kein WSL2, keine Virtualisierung): fetch-win-native.ps1
# bündelt alle nativen Bausteine (Downloads + weed.exe aus Go-Source +
# livekit-server.exe aus dem Pulse-Fork + direct-adapter.exe aus Rust-Source +
# uv-Python-venv). Das gebündelte Podman
# bleibt als Notfall-Fluchtweg (PULSE_HOST_BACKEND=container). Eigener Feed
# /updates/win-server/, getrennt vom Client-Feed /updates/win/.
#
# ACHTUNG (wie beim Client): ein Windows-Release erreicht Bestandsclients NUR mit
# einem Version-Bump in desktop/package.json — electron-updater ignoriert eine
# erneut publizierte gleiche Version stillschweigend.
#
# Läuft bei jedem main-Push, der den Desktop-Wrapper berührt. Manuell auslösbar.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'services/**'
      - 'shared/**'
      - 'infra/self-host/direct-adapter/**'
      # LiveKit-Fork (Commits, Patch, Bauskript): fetch-win-native.ps1 baut
      # livekit-server.exe daraus. Ohne Eintrag erreichte ein neuer Patch-Stand
      # nur das Linux-Image, nicht die Windows-Heimserver.
      - 'infra/livekit-fork/**'
      # fetch-win-native.ps1 bündelt beides mit: das Caddyfile-Template als
      # Konfiguration des nativen Caddy und uv.lock als Quelle des Python-venv.
      # Ohne Eintrag erreichte eine Änderung daran keinen Windows-Heimserver.
      - 'infra/self-host/s6/etc/caddy/Caddyfile.template'
      - 'uv.lock'
      - '.github/workflows/win-build-server.yml'
  workflow_dispatch: {}

# Getrennte Concurrency-Gruppe vom Client-Build, damit sich die beiden nicht
# gegenseitig abbrechen; laufenden Upload zu Ende laufen lassen.
concurrency:
  group: win-build-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # contents:write für den GitHub-Release-Schritt (infra/release/github-release.sh).
    # Der Workflow läuft nur auf main-Pushes und workflow_dispatch, nie für PRs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      # App-Hosting: Podman SHA-gepinnt für den Installer bündeln. Nur die drei
      # Binaries (podman.exe = Remote-Client, gvproxy + win-sshproxy =
      # Machine-Netzwerk) — das WSL2-Machine-Image lädt `podman machine init`
      # beim Erststart auf dem Zielgerät. Version + SHA zusammen bumpen (identisch
      # zu win-build.yml; lokales Gegenstück: desktop/scripts/fetch-win-podman.ps1).
      - name: Podman für App-Hosting bündeln
        shell: pwsh
        run: |
          $ver = '5.8.4'
          $sha = 'dce234b1810d1cbe3ce2562cf961294f942b0fa886a61897a2926aab17885f90'
          $zip = "$env:RUNNER_TEMP\podman-win.zip"
          Invoke-WebRequest -Uri "https://github.com/containers/podman/releases/download/v$ver/podman-remote-release-windows_amd64.zip" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) { throw "podman zip SHA mismatch: $actual" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\podman-extract"
          Copy-Item "$env:RUNNER_TEMP\podman-extract\podman-$ver\usr\bin\podman.exe","$env:RUNNER_TEMP\podman-extract\podman-$ver\usr\bin\gvproxy.exe","$env:RUNNER_TEMP\podman-extract\podman-$ver\usr\bin\win-sshproxy.exe" -Destination desktop\resources-podman\
          Get-ChildItem desktop\resources-podman\

      # ── Native Backend (Windows-Default, kein WSL2) ─────────────────────────
      # weed.exe: SeaweedFS hat kein volles Windows-Release → aus dem Source
      # gebaut (-WeedSource). livekit-server.exe: Pulse-Fork aus
      # infra/livekit-fork, dasselbe Skript wie im Linux-Image (-LivekitSource,
      # läuft in Git Bash). direct-adapter.exe: cargo (-AdapterSource).
      # venv: uv. Alles Weitere (caddy/garnet+dotnet/mediamtx/pg/frpc,
      # Service-Quellen, Templates) lädt fetch-win-native.ps1 idempotent.
      #
      # Go fest auf 1.26.8 — dieselbe Fassung wie die Stufe livekit-build in
      # infra/self-host/Dockerfile (LiveKits go.mod verlangt 1.26, SeaweedFS
      # 4.48 sogar 1.26.6). Hier stand '1.25.x'; damit hätte Go die passende
      # Fassung still selbst nachgeladen (GOTOOLCHAIN=auto, die Vorgabe der
      # Go-Distribution — aus go.mod gefolgert, nicht im Lauf-Protokoll belegt).
      - name: Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.8'

      - name: Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master — mit SHA gilt nur `with: toolchain`, nicht der Ref-Name
        with:
          toolchain: stable

      - name: uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Native Backend-Bausteine bündeln
        shell: pwsh
        run: desktop/scripts/fetch-win-native.ps1 -WeedSource -AdapterSource -LivekitSource

      # esbuild-Server-Bundle + electron-builder → desktop/release-server/:
      #   Pulse-Server-Setup-<version>.exe  (NSIS-Installer)
      #   latest.yml                        (electron-updater-Feed: Version + SHA512)
      #   *.blockmap                        (Delta-Download-Map)
      # `dist:win:server` läuft mit `--publish never` — der Upload macht der
      # scp-Step unten. Nutzt electron-builder-server.yml (eigener Feed, kein
      # Sidecar).
      - name: NSIS-Server-Installer bauen
        run: pnpm --filter @dcc/desktop run dist:win:server

      # Build-Artefakt als Fallback/Direktdownload (auch ohne erfolgreichen Upload).
      - name: Installer als Workflow-Artefakt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Pulse-Server-Setup-win
          path: desktop/release-server/Pulse-Server-Setup-*.exe
          if-no-files-found: error

      - name: SSH für scp einrichten
        # NUR von main aus in den Live-Feed — ein workflow_dispatch auf einem
        # Branch (CI-Validierung) baut + archiviert nur, published aber nie:
        # latest.yml würde sonst ALLE Server-Clients auf den Branch-Build updaten.
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Die Dateien liegen als GitHub-Release (Schritte 1 und 3 des Download-
      # Umzugs auf GitHub): ein Release je Version, feste Dateinamen — Mechanik im
      # Kopf von infra/release/github-release.sh. Der Update-Feed (latest.yml) zeigt
      # auf dieses Release (infra/release/feed-auf-github.sh; Mechanik und
      # Prüfungen im Kopf des Skripts).
      #
      # Drei Aufrufe aus EINER Dateiliste (der Feed zeigt damit auf genau die
      # Dateien, die hochgeladen werden), in dieser Reihenfolge:
      #   1. Feed umschreiben, nur lokal. Ein Prüfabbruch kann so nie mehr nach dem
      #      Ersetzen von Dateien im Release eintreten.
      #   2. Release befüllen. Bei einer NEUEN Version sind das Dateien, die noch
      #      kein Client kennt. Bei einem Neubau derselben Version (Rerun; bei der
      #      Windows-Server-App schon jeder Push auf services/** oder shared/**)
      #      ersetzt es die Dateien, auf die der LIVE-Feed zeigt: neue Fassung unter
      #      Zwischennamen hochladen, alte löschen, umbenennen. Dazwischen fehlt
      #      der Name im Normalfall für die Dauer EINES API-Aufrufs (404 für
      #      Update-Clients und latest/download; bei Aussetzern mit Wiederholungen
      #      länger; Verfahren und Abbruchfolgen im Kopf von github-release.sh). Der Feed nennt bis zu
      #      seinem Upload noch das sha512 der alten Fassung.
      #   3. Die Adressen anonym abfragen (--pruefen). Danach kommt SOFORT der
      #      Feed-Upload, noch vor den Rückfallkopien auf netcup.
      # Scheitert 1 oder 3, bleibt der Feed auf netcup bei der alten Fassung. Bei
      # einer neuen Version bleibt das ohne Folgen; bei einem Neubau derselben
      # Version bleibt er bis zum nächsten grünen Lauf auf dem alten sha512, und
      # Updates scheitern an der Prüfsumme (sicher, aber vergeblich). Bricht 2 NACH
      # dem Löschen der alten Datei ab (alle Wiederholungen erschöpft), FEHLT die
      # Datei unter ihrem Namen — das ist schlimmer als ein Prüfsummenfehler: 404
      # für Update-Clients und latest/download, bis der nächste Lauf sie wieder
      # hochlädt (Zwischendatei, Meldung und Heilung: Kopf von github-release.sh).
      - name: Auf GitHub Releases veröffentlichen
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE=$(ls desktop/release-server/Pulse-Server-Setup-*.exe)
          VERSION=$(node -p "require('./desktop/package.json').version")
          DATEIEN=("Pulse-Server-Setup-Windows.exe=$EXE" "Pulse-Server-Setup-Windows.exe.blockmap=$EXE.blockmap")
          bash infra/release/feed-auf-github.sh "$VERSION" desktop/release-server/latest.yml "${DATEIEN[@]}"
          bash infra/release/github-release.sh "$VERSION" "${DATEIEN[@]}"
          bash infra/release/feed-auf-github.sh --pruefen desktop/release-server/latest.yml

      # Der Feed bleibt auf netcup — dort kennen ihn die installierten Apps
      # (app-update.yml) —, zeigt aber auf GitHub. Er geht direkt nach dem
      # GitHub-Schritt hoch. nginx liefert ~/pulse/updates-win-server unter
      # /updates/win-server/ (infra/prod/web-nginx.conf); der Ordner ist read-only
      # in den web-Container gemountet (docker-compose.yml → /srv/updates-win-server).
      # Das Zielverzeichnis muss auf dem Server existieren (einmalig anlegen; scp
      # legt es nicht an).
      - name: Update-Feed nach howispulse hochladen
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 \
            desktop/release-server/latest.yml \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/updates-win-server/

      # Rückfallkopien auf netcup: Installer, Blockmap und die -latest-Kopie.
      # Niemand liest sie im Normalbetrieb — nimmt man feed-auf-github.sh aus dem
      # Workflow, stimmen die relativen Adressen im Feed wieder. scp lädt nur die
      # genannten Dateien hoch und löscht NIE etwas.
      - name: Rückfallkopien nach howispulse hochladen
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          EXE=$(ls desktop/release-server/Pulse-Server-Setup-*.exe)
          scp -i ~/.ssh/id_ed25519 \
            "$EXE" \
            "$EXE.blockmap" \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/updates-win-server/
          # Zusätzlich unter festem Dateinamen ablegen → stabiler Direktdownload
          # zum Weitergeben: https://howispulse.com/updates/win-server/Pulse-Server-Setup-latest.exe
          # (nginx leitet die Adresse seit 2026-10-13 nach GitHub um; die Datei hier
          # ist der Rückfall, falls die Umleitung wieder raus muss).
          # Wird bei jedem Build überschrieben. electron-updater nutzt ihn NICHT
          # (liest nur latest.yml) → harmlos neben den versionierten Dateien.
          scp -i ~/.ssh/id_ed25519 \
            "$EXE" \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/updates-win-server/Pulse-Server-Setup-latest.exe

      - name: SSH-Key wieder entfernen
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
