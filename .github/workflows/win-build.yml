name: win-build

# Baut den Windows-NSIS-Installer (Pulse-Desktop inkl. HQ-Streaming-Sidecar)
# samt Auto-Update-Artefakten. Installer + Blockmap gehen als GitHub-Release raus
# (feste Dateinamen); der Update-Feed `latest.yml` liegt per scp auf dem Cloud-VPS,
# von wo nginx ihn unter https://howispulse.com/updates/win/ ausliefert — dort
# pollt ihn electron-updater in der App —, und seine Adressen zeigen auf das
# Release. Installer, Blockmap und die -latest-Kopie liegen zusätzlich als
# Rückfall auf dem VPS. Gleiches Deploy-Muster wie der Flatpak-OSTree-Push
# (flatpak.yml) — selbe VPS-SSH-Secrets. Eine .exe deckt NVIDIA *und* AMD ab —
# der Sidecar erkennt die GPU selbst.
#
# Läuft bei jedem main-Push, der den Desktop-Wrapper oder den Windows-Sidecar
# berührt. Manuell auslösbar via "Run workflow".

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'streaming/win-hq-sidecar/**'
      # Der native Player wird seit 2026-08-05 mit ausgeliefert. Ohne diesen
      # Eintrag löst eine Änderung an ihm keinen Build aus, und der Installer
      # trüge weiter den alten Stand — genau die Falle, die flatpak.yml beim
      # FFmpeg-Patch schon hatte.
      - 'streaming/pulse-player/**'
      # Die gemeinsamen Kisten liegen ausserhalb von win-hq-sidecar/ UND
      # pulse-player/, obwohl beide dagegen linken (seit dem Zusammenlegen der
      # vormals mehrfachen Dateien in gemeinsame Crates). Ohne diese Einträge
      # löst eine Änderung dort keinen Build aus, und der Installer trüge
      # weiter den alten Stand — dieselbe Falle wie beim nativen Player oben,
      # nur eine Ebene höher im Verzeichnisbaum.
      #
      # Die Liste muss REKURSIV vollständig sein: pulse-whip hängt selbst an
      # pulse-zeitbasis und pulse-bildmarke. Nachgerechnet wird das von
      # streaming/zwillinge/tests/bau_ausloeser.rs — wer hier etwas ändert,
      # bekommt dort die Gegenprobe.
      - 'streaming/pulse-redact/**'
      - 'streaming/pulse-zeitbasis/**'
      - 'streaming/pulse-whip/**'
      - 'streaming/pulse-zeigerbild/**'
      - 'streaming/pulse-bildmarke/**'
      - 'streaming/pulse-fernsteuerung/**'
      - 'streaming/pulse-ablage/**'
      - '.github/workflows/win-build.yml'
  workflow_dispatch: {}

# Parallele Pushes dürfen nicht auf dem Upload-Target rasen; laufenden Upload
# zu Ende laufen lassen (wie flatpak.yml).
concurrency:
  group: win-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # contents:write für den GitHub-Release-Schritt (infra/release/github-release.sh).
    # Der Workflow läuft nur auf main-Pushes und workflow_dispatch, nie für PRs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master — mit SHA gilt nur `with: toolchain`, nicht der Ref-Name
        with:
          toolchain: stable

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            streaming/win-hq-sidecar
            streaming/pulse-player

      # ffmpeg-dist/ ist nicht im Git (~307 MB) — das Script lädt die
      # SHA-gepinnte FFmpeg-LGPL-Distribution nach ffmpeg-dist/n8.1-lgpl-shared/,
      # wohin .cargo/config.toml FFMPEG_DIR zeigt. Quelle ist eine SELBST
      # gehostete, eingefrorene Kopie auf unserem VPS (nicht mehr BtbNs
      # rollendes `latest`-Tag, das bei jedem Re-Release den SHA-Pin brach und
      # den Workflow ab 2026-06-10 reihenweise failen liess). Cache nur noch
      # Performance, nicht Korrektheit; keyed auf das Script (enthält URL+SHA),
      # ein bewusster Bump invalidiert ihn automatisch.
      - name: FFmpeg-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: streaming/win-hq-sidecar/ffmpeg-dist
          key: ffmpeg-dist-${{ hashFiles('streaming/win-hq-sidecar/scripts/fetch-ffmpeg.ps1') }}

      - name: FFmpeg holen (vendored, SHA-gepinnt)
        shell: pwsh
        run: ./streaming/win-hq-sidecar/scripts/fetch-ffmpeg.ps1

      # Wie der webrtc-rs-Zweig des Players unten: `[patch.crates-io]` zeigt
      # auf `vendor/windows-capture/` (gitignored), ohne den Zweig bricht
      # cargo schon beim Auflösen ab.
      - name: windows-capture-Zweig herstellen (Sidecar)
        shell: bash
        run: ./streaming/win-hq-sidecar/scripts/bootstrap-windows-capture.sh


      # Der native HQ-Player (`streaming/pulse-player/`). Er braucht zwei Dinge,
      # die der Sidecar nicht braucht:
      #
      #  * `bootstrap-webrtc.sh` — die Crate bindet webrtc-rs über
      #    `[patch.crates-io]` an `vendor/webrtc-rs/`, und das ist gitignored
      #    (reproduzierbar herstellbar statt eingecheckt). Fehlt es, bricht
      #    cargo schon beim AUFLÖSEN ab, nicht erst beim Übersetzen. Das Script
      #    ist bash — der windows-latest-Runner bringt Git-Bash mit.
      #  * `FFMPEG_DIR` als Schritt-ENV statt als `.cargo/config.toml` in der
      #    Crate: ein `[env]`-Block dort gölte für JEDE Plattform und würde den
      #    Linux-/Flatpak-Bau auf ein Windows-Verzeichnis zeigen lassen, das es
      #    dort nicht gibt (unter Linux kommt FFmpeg über pkg-config).
      #
      # Läuft NACH dem Sidecar, weil er dessen `ffmpeg-dist/` mitbenutzt — eine
      # zweite Kopie derselben ~300 MB wäre sinnlos, und ausgeliefert wird
      # ohnehin nur EIN Satz DLLs (s. electron-builder.yml).
      - name: webrtc-rs-Zweig herstellen (Player)
        shell: bash
        run: ./streaming/pulse-player/scripts/bootstrap-webrtc.sh

      # Sidecar UND Player GLEICHZEITIG bauen — zwei unabhaengige Crates, die
      # sich nur `ffmpeg-dist/` teilen (oben schon geholt).
      #
      # **Warum nebenlaeufig im SELBEN Job und nicht als zwei Jobs.** Zwei Jobs
      # waeren die uebliche Antwort, kosten hier aber mehr, als sie bringen:
      # jeder braucht Checkout, Toolchain, Cargo-Cache (~45 s) und FFmpeg
      # (~20 s) erneut, und der Installer-Job muesste die Binaerdateien als
      # Artefakt durchreichen. Gemessen am warmen Lauf 31907930095 (Sidecar
      # 2m11s, Player 3m20s) waere die Wanduhr damit von ~8 auf ~7,5 min
      # gefallen — bei dreifachem Windows-Minutenverbrauch. Nebenlaeufig in
      # einem Job entfaellt der ganze Zusatzaufwand.
      #
      # **Warum die Ausgabe in Dateien geht.** Zwei gleichzeitig laufende
      # cargo-Prozesse schrieben sonst ineinander, und eine Fehlermeldung
      # waere nicht mehr zuzuordnen. Die Protokolle werden nach dem Warten
      # nacheinander ausgegeben — bei Erfolg wie bei Fehlschlag.
      #
      # **Wenn das je Aerger macht** (Speicherdruck auf dem Runner, unlesbare
      # Fehler): die zwei `Start-Job`-Bloecke wieder zu zwei `cargo build`
      # -Schritten machen, das ist der ganze Rueckweg.
      - name: Sidecar und Player bauen (release, gleichzeitig)
        shell: pwsh
        env:
          FFMPEG_DIR: ${{ github.workspace }}\streaming\win-hq-sidecar\ffmpeg-dist\n8.1-lgpl-shared
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          $ws = "${{ github.workspace }}"
          $sidecar = Start-Job -Name sidecar -ScriptBlock {
            Set-Location "$using:ws\streaming\win-hq-sidecar"
            cargo build --release *>&1
            exit $LASTEXITCODE
          }
          $player = Start-Job -Name player -ScriptBlock {
            Set-Location "$using:ws\streaming\pulse-player"
            $env:FFMPEG_DIR = "$using:ws\streaming\win-hq-sidecar\ffmpeg-dist\n8.1-lgpl-shared"
            $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
            cargo build --release *>&1
            exit $LASTEXITCODE
          }
          Wait-Job $sidecar, $player | Out-Null
          $fehler = $false
          foreach ($j in @($sidecar, $player)) {
            Write-Host "::group::$($j.Name)"
            Receive-Job $j
            Write-Host "::endgroup::"
            if ($j.State -ne 'Completed') { $fehler = $true; Write-Host "$($j.Name): $($j.State)" }
          }
          # `Start-Job` meldet einen cargo-Fehlschlag NICHT ueber den
          # Job-Status — nur ueber das, was cargo geschrieben hat. Deshalb
          # zusaetzlich pruefen, ob die Binaerdateien wirklich entstanden sind:
          # ein stiller Fehlschlag hier liesse den Installer mit dem Stand des
          # vorigen Laufs (oder ganz ohne Sidecar) durchlaufen.
          $erwartet = @(
            "$ws\streaming\win-hq-sidecar\target\release\pulse-win-hq-sidecar.exe",
            "$ws\streaming\pulse-player\target\release\pulse-player.exe"
          )
          foreach ($p in $erwartet) {
            if (-not (Test-Path $p)) { Write-Host "FEHLT: $p"; $fehler = $true }
          }
          if ($fehler) { exit 1 }

      - name: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      # Podman-Bündelung für App-Hosting entfernt (2026-07-14, App-Hosting
      # geparkt) — der Windows-Client hostet nicht mehr, das gebündelte Podman
      # war totes Gewicht. Zum Reaktivieren: Podman-Download-Step (SHA-gepinnt
      # nach desktop\resources-podman\) + den resources-podman-extraResource in
      # electron-builder.yml (win-Sektion) wieder aufnehmen.

      # esbuild-Bundle + electron-builder → desktop/release/:
      #   Pulse-Setup-<version>.exe  (NSIS-Installer)
      #   latest.yml                 (electron-updater-Feed: Version + SHA512)
      #   *.blockmap                 (Delta-Download-Map)
      # `dist:win` läuft mit `--publish never` — der Upload macht der scp-Step
      # unten, nicht electron-builder. Zieht den Sidecar + DLLs aus
      # streaming/win-hq-sidecar/target/release/ und den Player aus
      # streaming/pulse-player/target/release/ als extraResources; beide landen
      # in demselben resources/hq-sidecar/, weil sie sich die FFmpeg-DLLs teilen
      # (siehe desktop/electron-builder.yml).
      - name: NSIS-Installer bauen
        run: pnpm --filter @dcc/desktop run dist:win

      # Build-Artefakt als Fallback/Direktdownload (auch ohne erfolgreichen Upload).
      - name: Installer als Workflow-Artefakt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Pulse-Setup-win
          path: desktop/release/Pulse-Setup-*.exe
          if-no-files-found: error

      # Installer und Update-Feed gehen per scp auf den Cloud-VPS (dieselben
      # SSH-Secrets wie flatpak.yml). nginx serviert ~/pulse/updates-win unter
      # /updates/win/ (siehe infra/prod/web-nginx.conf + docker-compose.yml).
      - name: SSH für scp einrichten
        # NUR von main aus in den Live-Feed — ein workflow_dispatch auf einem
        # Branch (CI-Validierung) baut + archiviert nur, published aber nie:
        # latest.yml würde sonst ALLE Windows-Clients auf den Branch-Build updaten.
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Die Dateien liegen als GitHub-Release (Schritte 1 und 3 des Download-
      # Umzugs auf GitHub): ein Release je Version, feste Dateinamen — Mechanik im
      # Kopf von infra/release/github-release.sh. Der Update-Feed (latest.yml) zeigt
      # auf dieses Release (infra/release/feed-auf-github.sh; Mechanik und
      # Prüfungen im Kopf des Skripts).
      #
      # Drei Aufrufe aus EINER Dateiliste (der Feed zeigt damit auf genau die
      # Dateien, die hochgeladen werden), in dieser Reihenfolge:
      #   1. Feed umschreiben, nur lokal. Ein Prüfabbruch kann so nie mehr nach dem
      #      Ersetzen von Dateien im Release eintreten.
      #   2. Release befüllen. Bei einer NEUEN Version sind das Dateien, die noch
      #      kein Client kennt. Bei einem Neubau derselben Version (Rerun; bei der
      #      Windows-Server-App schon jeder Push auf services/** oder shared/**) ersetzt
      #      es die Dateien, auf die der LIVE-Feed zeigt: ohne 404-Fenster
      #      (Zwischenname, dann umbenennen), aber der Feed nennt bis zu seinem
      #      Upload noch das sha512 der alten Fassung.
      #   3. Die Adressen anonym abfragen (--pruefen). Danach kommt SOFORT der
      #      Feed-Upload, noch vor den Rückfallkopien auf netcup.
      # Scheitert 1 oder 3, bleibt der Feed auf netcup bei der alten Fassung. Bei
      # einer neuen Version bleibt das ohne Folgen; bei einem Neubau derselben
      # Version bleibt er bis zum nächsten grünen Lauf auf dem alten sha512, und
      # Updates scheitern an der Prüfsumme (sicher, aber vergeblich).
      - name: Auf GitHub Releases veröffentlichen
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE=$(ls desktop/release/Pulse-Setup-*.exe)
          VERSION=$(node -p "require('./desktop/package.json').version")
          DATEIEN=("Pulse-Setup-Windows.exe=$EXE" "Pulse-Setup-Windows.exe.blockmap=$EXE.blockmap")
          bash infra/release/feed-auf-github.sh "$VERSION" desktop/release/latest.yml "${DATEIEN[@]}"
          bash infra/release/github-release.sh "$VERSION" "${DATEIEN[@]}"
          bash infra/release/feed-auf-github.sh --pruefen desktop/release/latest.yml

      # Der Feed bleibt auf netcup — dort kennen ihn die installierten Apps
      # (app-update.yml) —, zeigt aber auf GitHub. Er geht direkt nach dem
      # GitHub-Schritt hoch. nginx liefert ~/pulse/updates-win unter /updates/win/
      # (infra/prod/web-nginx.conf, docker-compose.yml); das Zielverzeichnis muss
      # auf dem Server existieren (einmalig anlegen; scp legt es nicht an).
      - name: Update-Feed nach howispulse hochladen
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 \
            desktop/release/latest.yml \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/updates-win/

      # Rückfallkopien auf netcup: Installer, Blockmap und die -latest-Kopie.
      # Niemand liest sie im Normalbetrieb — nimmt man feed-auf-github.sh aus dem
      # Workflow, stimmen die relativen Adressen im Feed wieder. scp lädt nur die
      # genannten Dateien hoch und löscht NIE etwas (aufgeräumt wird mit
      # infra/prod/updates-prune.sh). scp statt rsync: der windows-latest-Runner
      # hat KEIN rsync (flatpak.yml läuft auf Ubuntu und installiert es), aber den
      # OpenSSH-Client samt Git Bash.
      - name: Rückfallkopien nach howispulse hochladen
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          EXE=$(ls desktop/release/Pulse-Setup-*.exe)
          scp -i ~/.ssh/id_ed25519 \
            "$EXE" \
            "$EXE.blockmap" \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/updates-win/
          # Zusätzlich unter festem Dateinamen ablegen → stabiler Direktdownload
          # zum Weitergeben: https://howispulse.com/updates/win/Pulse-Setup-latest.exe
          # (nginx leitet die Adresse seit 2026-10-13 nach GitHub um; die Datei hier
          # ist der Rückfall, falls die Umleitung wieder raus muss).
          # Wird bei jedem Build überschrieben. electron-updater nutzt ihn NICHT
          # (liest nur latest.yml) → harmlos neben den versionierten Dateien.
          scp -i ~/.ssh/id_ed25519 \
            "$EXE" \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/updates-win/Pulse-Setup-latest.exe

      - name: SSH-Key wieder entfernen
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
