name: mac-build

# Baut das macOS-DMG (Pulse-Desktop inkl. HQ-Streaming-Sidecar und nativem
# Player). DMG, .zip und Blockmap gehen als GitHub-Release raus (feste
# Dateinamen, Links in web/src/lib/downloads/appDownloads.ts); der Update-Feed
# `latest-mac.yml` liegt per scp auf dem Cloud-VPS und zeigt auf das Release.
# Als Rückfall liegen DMG, .zip und Blockmap zusätzlich dort (nginx leitet
# https://howispulse.com/downloads/Pulse-latest.dmg nach GitHub um). Gleiches
# Deploy-Muster wie win-build.yml / flatpak.yml — selbe VPS-SSH-Secrets.
#
# Stufe B (Stand 2026-10-05): SIGNIERT + NOTARISIERT. Das Developer-ID-Zertifikat
# (CSC_LINK/CSC_KEY_PASSWORD) wird via apple-actions/import-codesign-certs in
# einen eigenen Runner-Keychain importiert — electron-builder findet die Identity
# dann über die Keychain-Suche (sein eigener CSC_LINK-Pfad ist auf macOS-15-
# Runnern kaputt, s. Kommentar beim Import-Step). APPLE_API_KEY_P8/KEY_ID/ISSUER
# (notarytool) als Secrets; electron-builder signiert mit Hardened Runtime und
# schickt die .app durch Notarisierung. electron-updater ist auf macOS aktiv:
# Client-Feed /updates/mac/, Server-Feed /updates/mac-server/ (je latest-mac.yml,
# das auf das .zip im GitHub-Release zeigt). Ohne Secrets (z. B. Fork-PR) fällt der Build auf unsigniert-ad-hoc
# zurück (afterPack.cjs-Gate) und überspringt die Notarisierung still. Konzept:
# docs/plans/2026-06-15-macos-client.md.
#
# WARUM FFmpeg HIER gebaut statt (wie Windows) vorgebaut gezogen wird:
# Der Mac-Sidecar linkt gegen eine SELBSTGEBAUTE LGPL-FFmpeg (openssl statt Apple
# SecureTransport — sonst droppt MediaMTX den RTMPS-Publish nach 10s; Details in
# streaming/mac-hq-sidecar/scripts/build-ffmpeg.sh). Ein fertiges LGPL-Prebuild
# wie BtbN für Windows gibt es dafür nicht. macOS-dylibs tragen zudem ihren
# absoluten Build-Pfad als install-name in sich; bundle-dylibs.sh liest den per
# otool aus und kopiert von dort → eine vom VPS gezogene Dist müsste man auf den
# EXAKT gleichen Pfad entpacken. Auf dem Runner selbst bauen hält alle absoluten
# Pfade konsistent → bundle-dylibs.sh funktioniert unverändert. Der FFmpeg-Cache
# macht den ~15-min-Kaltbau danach zu einem schnellen Restore.
#
# Läuft bei jedem main-Push, der den Desktop-Wrapper, den Mac-Sidecar oder den
# nativen Player berührt.
# Manuell auslösbar via "Run workflow".

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'streaming/mac-hq-sidecar/**'
      # Die gemeinsamen Kisten liegen ausserhalb von mac-hq-sidecar/, obwohl der
      # Mac-Sidecar dagegen linkt (seit dem Zusammenlegen der vormals mehrfachen
      # Dateien in gemeinsame Crates). Ohne diese Einträge löst eine Änderung
      # dort keinen DMG-Build aus, und das ausgelieferte Bundle trüge weiter den
      # alten Stand. **pulse-zeigerbild gehört seit dem 2026-08-22 dazu**: hier
      # stand, es werde nicht gebraucht, weil der Mac-Sidecar nicht dagegen linkt
      # — das stimmte, solange nur er im DMG lag. Seit der native Player
      # mitgebaut wird, gilt es nicht mehr, denn DER hängt daran. Aufgefallen
      # ist es nicht beim Lesen, sondern weil bau_ausloeser.rs rot wurde.
      #
      # Die Liste muss REKURSIV vollständig sein: pulse-whip hängt selbst an
      # pulse-zeitbasis und pulse-bildmarke. Nachgerechnet wird das von
      # streaming/zwillinge/tests/bau_ausloeser.rs — wer hier etwas ändert,
      # bekommt dort die Gegenprobe.
      - 'streaming/pulse-redact/**'
      - 'streaming/pulse-zeitbasis/**'
      - 'streaming/pulse-whip/**'
      - 'streaming/pulse-bildmarke/**'
      - 'streaming/pulse-zeigerbild/**'
      - 'streaming/pulse-fernsteuerung/**'
      - 'streaming/pulse-ablage/**'
      # Der native Player wird seit 2026-08-20 auch im DMG ausgeliefert. Ohne
      # diesen Eintrag löst eine Änderung an ihm keinen Build aus, und das DMG
      # trüge weiter den alten Stand — dieselbe Falle, die win-build.yml beim
      # Player und flatpak.yml beim FFmpeg-Patch schon hatte.
      - 'streaming/pulse-player/**'
      - '.github/workflows/mac-build.yml'
  workflow_dispatch: {}

# Parallele Pushes dürfen nicht auf dem Upload-Target rasen; laufenden Upload
# zu Ende laufen lassen (wie win-build.yml / flatpak.yml).
concurrency:
  group: mac-build
  cancel-in-progress: false

jobs:
  build:
    # macos-latest = Apple Silicon (arm64) → matcht das arm64-DMG + --enable-neon.
    runs-on: macos-latest
    # contents:write für den GitHub-Release-Schritt (infra/release/github-release.sh).
    # Der Workflow läuft nur auf main-Pushes und workflow_dispatch, nie für PRs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master — mit SHA gilt nur `with: toolchain`, nicht der Ref-Name
        with:
          toolchain: stable

      - name: Cargo-Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            streaming/mac-hq-sidecar
            streaming/pulse-player

      # FFmpeg-Build + der spätere Dylib-Bundle brauchen openssl@3 + opus Headers/
      # Libs (VideoToolbox/AudioToolbox liefert macOS selbst). openssl@3 ist auf
      # macos-latest meist vorinstalliert, opus und dav1d nicht — idempotent
      # nachziehen. **dav1d gehört zwingend dazu**: `build-ffmpeg.sh` baut mit
      # `--enable-libdav1d`, und configure bricht ohne die Bibliothek hart ab
      # ("dav1d >= 0.5.0 not found using pkg-config"). Es ist der AV1-Decoder —
      # ohne ihn zeigt der native Player auf M1/M2 kein AV1-Bild.
      #
      # Am 2026-08-22 genau so gebrochen: dav1d kam ins Bauskript, weil es auf
      # der Entwicklungsmaschine per Homebrew vorlag; dort lief der Bau, hier
      # nicht. Die Zeile im Skriptkopf ("Requires: … + dav1d") stand da schon.
      - name: FFmpeg-Build-Deps (Homebrew)
        run: brew install openssl@3 opus dav1d

      # ~/src/ffmpeg-openssl ist die private LGPL-FFmpeg-Installation, gegen die
      # der Sidecar linkt (default PREFIX in build-ffmpeg.sh = $HOME/src/
      # ffmpeg-openssl → auf dem Runner /Users/runner/src/ffmpeg-openssl). Cache
      # nur Performance, nicht Korrektheit; keyed auf das Build-Script — ein
      # FFmpeg-Bump (VER/configure-Flags) invalidiert ihn automatisch. Der stabile
      # Runner-Home-Pfad hält die dylib-install-names über Restores hinweg gültig.
      - name: FFmpeg-Cache
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/src/ffmpeg-openssl
          key: mac-ffmpeg-openssl-${{ hashFiles('streaming/mac-hq-sidecar/scripts/build-ffmpeg.sh') }}

      # Nur bei Cache-Miss aus dem Quelltext bauen (~15 min). Der Guard macht den
      # Restore-Fall zum No-Op — build-ffmpeg.sh selbst würde sonst immer neu bauen.
      - name: FFmpeg bauen (LGPL, openssl, Cache-Miss)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash streaming/mac-hq-sidecar/scripts/build-ffmpeg.sh

      - name: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      # Der Player linkt eine gevendorte, gepatchte webrtc-rs (drei Patches in
      # streaming/pulse-player/patches/ — undeclared-SSRC-Streams für FlexFEC,
      # NACK-Resend-Delay, H264-STAP-A-Bounds-Check). vendor/ ist gitignored,
      # ohne diesen Schritt scheitert schon `cargo resolve`. Gleiches Muster wie
      # in win-build.yml.
      - name: webrtc-rs-Zweig herstellen (Player)
        run: ./streaming/pulse-player/scripts/bootstrap-webrtc.sh

      # Signatur-Zertifikat in einen eigenen Keychain importieren (mit Partition-
      # List). Warum NICHT electron-builders CSC_LINK-Pfad: der legt den Temp-
      # Keychain mit Zufallspasswort an, ruft `set-key-partition-list -k` aber
      # mit dem P12-Passwort auf — auf macOS-15-Runnern schlägt SecKeychainUnlock
      # dann garantiert fehl (Run 37345992154). Mit hier vorliegender Identity
      # findet electron-builder sie via Keychain-Suche selbst; CSC_LINK wird
      # deshalb unten NICHT gesetzt. Ohne Secrets (Fork-PR) ad-hoc-Fallback.
      - name: Signatur-Zertifikat importieren
        if: github.ref == 'refs/heads/main'
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      # Notarisierung (.p8): electron-builder verlangt in APPLE_API_KEY einen
      # DATEIPFAD — das Secret ist base64, also einmal entschlüsseln. Fehlt das
      # Secret (z. B. Fork-PR), landet eine leere Datei da: electron-builder
      # überspringt Notarisierung dann still.
      # Den Schlüssel gibt es nur auf main (wie das Zertifikat oben): auf jedem
      # anderen Zweig bekommt der Schritt das Secret gar nicht erst und legt die
      # leere Datei an — dasselbe Verhalten wie „Secret fehlt“. Grenze: die
      # Bedingung steht im Workflow selbst; wer ihn auf einem eigenen Zweig
      # ändern kann, umgeht sie (dagegen: Environment mit „Deployment branches:
      # main“).
      - name: Notarisierungs-Key entschlüsseln
        env:
          APPLE_API_KEY_P8: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_API_KEY_P8 || '' }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey_643258YHJ2.p8"

      # esbuild-Bundle → cargo build --release (Sidecar UND Player) →
      # bundle-dylibs.sh (ein gemeinsamer Dylib-Satz für beide,
      # @loader_path-Rewrite + ad-hoc-Sign) → electron-builder --mac → DMG+ZIP in
      # desktop/release/. `dist:mac` läuft mit `--publish never`; der Upload macht
      # der scp-Step unten. PKG_CONFIG_PATH zeigt cargo auf die frisch gebaute
      # FFmpeg (überschreibt den für den Entwickler-Mac hinterlegten Pfad in
      # streaming/mac-hq-sidecar/.cargo/config.toml — cargos [env] ist non-force,
      # eine gesetzte Env gewinnt).
      #
      # Stufe B (2026-10-05): Identity kommt aus dem importierten Keychain
      # (siehe Import-Step oben), APPLE_API_KEY* = Notarytool-Credentials. Ohne
      # Secrets wird unsigniert ad-hoc gebaut (Fallback). client-Feed:
      # /updates/mac/.
      #
      # Podman-Bündelung für App-Hosting entfernt (2026-07-14, App-Hosting
      # geparkt) — analog zu win-build. Zum Reaktivieren: `bash scripts/
      # fetch-mac-podman.sh` wieder in dist:mac + den resources-podman-mac-
      # extraResource in electron-builder.yml (mac-Sektion) aufnehmen.
      - name: DMG bauen (signiert + notarisiert)
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_643258YHJ2.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export PKG_CONFIG_PATH="$HOME/src/ffmpeg-openssl/lib/pkgconfig:/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/opus/lib/pkgconfig"
          pnpm --filter @dcc/desktop run dist:mac

      # Build-Artefakt als Fallback/Direktdownload (auch ohne erfolgreichen Upload).
      - name: DMG als Workflow-Artefakt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Pulse-mac-dmg
          path: desktop/release/Pulse-*.dmg
          if-no-files-found: error

      # DMG per scp auf den Cloud-VPS (dieselben SSH-Secrets wie win-build.yml /
      # flatpak.yml). nginx serviert ~/pulse/downloads unter /downloads/.
      - name: SSH für scp einrichten
        # NUR von main aus hochladen — ein workflow_dispatch auf einem Branch
        # (CI-Validierung) baut + archiviert nur, überschreibt aber nie das
        # Live-DMG.
        if: github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Die Dateien liegen als GitHub-Release (Schritte 1 und 3 des Download-
      # Umzugs auf GitHub): ein Release je Version, feste Dateinamen — Mechanik im
      # Kopf von infra/release/github-release.sh. Der Update-Feed (latest-mac.yml)
      # zeigt auf dieses Release (infra/release/feed-auf-github.sh; Mechanik und
      # Prüfungen im Kopf des Skripts), zip UND dmg.
      #
      # Drei Aufrufe aus EINER Dateiliste (der Feed zeigt damit auf genau die
      # Dateien, die hochgeladen werden), in dieser Reihenfolge:
      #   1. Feed umschreiben, nur lokal. Ein Prüfabbruch kann so nie mehr nach dem
      #      Ersetzen von Dateien im Release eintreten.
      #   2. Release befüllen. Bei einer NEUEN Version sind das Dateien, die noch
      #      kein Client kennt. Bei einem Neubau derselben Version (Rerun) ersetzt
      #      es die Dateien, auf die der LIVE-Feed zeigt: neue Fassung unter
      #      Zwischennamen hochladen, alte löschen, umbenennen. Dazwischen fehlt
      #      der Name im Normalfall für die Dauer EINES API-Aufrufs (404 für
      #      Update-Clients und latest/download; bei Aussetzern mit Wiederholungen
      #      länger; Verfahren und Abbruchfolgen im Kopf von github-release.sh).
      #      Der Feed nennt bis zu seinem Upload noch das sha512 der alten Fassung.
      #   3. Die Adressen anonym abfragen (--pruefen). Danach kommt SOFORT der
      #      Feed-Upload, noch vor den Rückfallkopien auf netcup.
      # Scheitert 1 oder 3, bleibt der Feed auf netcup bei der alten Fassung. Bei
      # einer neuen Version bleibt das ohne Folgen; bei einem Neubau derselben
      # Version bleibt er bis zum nächsten grünen Lauf auf dem alten sha512, und
      # Updates scheitern an der Prüfsumme (sicher, aber vergeblich). Bricht 2 NACH
      # dem Löschen der alten Datei ab (alle Wiederholungen erschöpft), FEHLT die
      # Datei unter ihrem Namen — das ist schlimmer als ein Prüfsummenfehler: 404
      # für Update-Clients und latest/download, bis der nächste Lauf sie wieder
      # hochlädt (Zwischendatei, Meldung und Heilung: Kopf von github-release.sh).
      #
      # Die festen Namen tragen keine Architektur. MacUpdater wählt aber am Namen
      # (MacUpdater.js:70-76: Einträge mit "arm64" in Adresse oder Name). Heute gibt
      # es nur einen arm64-Bau, und er findet das .zip trotzdem; käme je ein x64-
      # oder Universal-Bau dazu, brauchten die festen Namen die Architektur
      # (z. B. Pulse-macOS-arm64.zip) — samt Anpassung in appDownloads.ts.
      - name: Auf GitHub Releases veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls desktop/release/Pulse-*.dmg | head -n1)
          ZIP=$(ls desktop/release/*.zip | head -n1)
          VERSION=$(node -p "require('./desktop/package.json').version")
          DATEIEN=("Pulse-macOS.dmg=$DMG" "Pulse-macOS.zip=$ZIP" "Pulse-macOS.zip.blockmap=$ZIP.blockmap")
          bash infra/release/feed-auf-github.sh "$VERSION" desktop/release/latest-mac.yml "${DATEIEN[@]}"
          bash infra/release/github-release.sh "$VERSION" "${DATEIEN[@]}"
          bash infra/release/feed-auf-github.sh --pruefen desktop/release/latest-mac.yml

      # Mac-Auto-Update-Feed (Stufe B): latest-mac.yml nach ~/pulse/updates-mac/
      # (nginx: /updates/mac/). Der Feed bleibt auf netcup — dort kennen ihn die
      # installierten Apps (app-update.yml) —, zeigt aber auf GitHub und geht direkt
      # nach dem GitHub-Schritt hoch. electron-updater lädt das .zip, auf das er
      # zeigt (NICHT die DMG — die bleibt der Direktdownload).
      - name: Mac-Update-Feed nach howispulse hochladen
        if: github.ref == 'refs/heads/main'
        run: |
          scp -i ~/.ssh/id_ed25519 \
            desktop/release/latest-mac.yml \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/updates-mac/

      # Rückfallkopien auf netcup: .zip, .blockmap und die DMG unter festem Namen
      # (stabiler Direktdownload /downloads/Pulse-latest.dmg; nginx leitet die
      # Adresse seit 2026-10-13 nach GitHub um, die Datei ist der Rückfall, falls
      # die Umleitung wieder raus muss). Niemand liest sie im Normalbetrieb — nimmt
      # man feed-auf-github.sh aus dem Workflow, stimmen die relativen Adressen im
      # Feed wieder. Die Zielverzeichnisse müssen auf dem Server existieren (scp
      # legt sie nicht an).
      - name: Rückfallkopien nach howispulse hochladen
        if: github.ref == 'refs/heads/main'
        run: |
          DMG=$(ls desktop/release/Pulse-*.dmg | head -n1)
          scp -i ~/.ssh/id_ed25519 \
            desktop/release/*.zip \
            desktop/release/*.zip.blockmap \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/updates-mac/
          scp -i ~/.ssh/id_ed25519 \
            "$DMG" \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/downloads/Pulse-latest.dmg

      - name: SSH-Key wieder entfernen
        if: always()
        run: rm -f ~/.ssh/id_ed25519

  # ── Server-App-DMG (Heim-Server 2026-09-27) ────────────────────────────────
  # Schneller als der Client-Job: KEIN Rust/FFmpeg (der Server streamt nicht
  # selbst — der allinone-Container tut's), nur esbuild-Server-Bundle + das
  # gepinnte Mac-Podman (fetch-mac-podman.sh) + electron-builder mit der
  # Server-Config. Läuft im selben Workflow, damit Secrets/Runner-Muster
  # geteilt bleiben; Upload nur von main (wie der Client).
  build-server:
    runs-on: macos-latest
    # contents:write für den GitHub-Release-Schritt (infra/release/github-release.sh).
    # Der Workflow läuft nur auf main-Pushes und workflow_dispatch, nie für PRs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: Signatur-Zertifikat importieren (Server)
        if: github.ref == 'refs/heads/main'
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      # Nur auf main mit echtem Schlüssel, sonst leere Datei (Begründung beim
      # Client-Job oben).
      - name: Notarisierungs-Key entschlüsseln (Server)
        env:
          APPLE_API_KEY_P8: ${{ github.ref == 'refs/heads/main' && secrets.APPLE_API_KEY_P8 || '' }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey_643258YHJ2.p8"

      - name: Server-DMG bauen (signiert + notarisiert, mit Mac-Podman)
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_643258YHJ2.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @dcc/desktop run dist:mac:server

      - name: Server-DMG als Workflow-Artefakt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Pulse-Server-mac-dmg
          path: desktop/release-server/*.dmg
          if-no-files-found: error

      - name: SSH für scp einrichten
        if: github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Die Dateien liegen als GitHub-Release, der Feed (latest-mac.yml) zeigt darauf —
      # Begründung, Reihenfolge und Umgang mit Neubauten wie beim Client-Job oben:
      # Feed lokal umschreiben, Release befüllen, Adressen anonym prüfen, Feed
      # SOFORT hochladen, erst danach die Rückfallkopien auf netcup. Zu den festen
      # Namen ohne Architektur siehe ebenfalls oben.
      - name: Auf GitHub Releases veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls desktop/release-server/*.dmg | head -n1)
          ZIP=$(ls desktop/release-server/*.zip | head -n1)
          VERSION=$(node -p "require('./desktop/package.json').version")
          DATEIEN=("Pulse-Server-macOS.dmg=$DMG" "Pulse-Server-macOS.zip=$ZIP" "Pulse-Server-macOS.zip.blockmap=$ZIP.blockmap")
          bash infra/release/feed-auf-github.sh "$VERSION" desktop/release-server/latest-mac.yml "${DATEIEN[@]}"
          bash infra/release/github-release.sh "$VERSION" "${DATEIEN[@]}"
          bash infra/release/feed-auf-github.sh --pruefen desktop/release-server/latest-mac.yml

      # Server-Mac-Update-Feed (Stufe B): eigener Feed /updates/mac-server/ —
      # die Server-App hat eigene Versionen/appId (electron-builder-server.yml).
      # Wie beim Client: der Feed bleibt auf netcup, zeigt aber auf GitHub und geht
      # direkt nach dem GitHub-Schritt hoch.
      - name: Server-Mac-Update-Feed nach howispulse hochladen
        if: github.ref == 'refs/heads/main'
        run: |
          scp -i ~/.ssh/id_ed25519 \
            desktop/release-server/latest-mac.yml \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/updates-mac-server/

      # Rückfallkopien auf netcup (wie beim Client): .zip, .blockmap und die DMG
      # unter festem Namen (/downloads/Pulse-Server-latest.dmg).
      - name: Rückfallkopien nach howispulse hochladen
        if: github.ref == 'refs/heads/main'
        run: |
          DMG=$(ls desktop/release-server/*.dmg | head -n1)
          scp -i ~/.ssh/id_ed25519 \
            desktop/release-server/*.zip \
            desktop/release-server/*.zip.blockmap \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/updates-mac-server/
          scp -i ~/.ssh/id_ed25519 \
            "$DMG" \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/downloads/Pulse-Server-latest.dmg

      - name: SSH-Key wieder entfernen
        if: always()
        run: rm -f ~/.ssh/id_ed25519
