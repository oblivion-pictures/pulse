# Pulse Self-Host All-in-One Image — build & publish to GHCR.
#
# Output:
#   ghcr.io/oblivion-pictures/pulse:edge          (rolling, every main push)
#   ghcr.io/oblivion-pictures/pulse:stable        (latest release)
#   ghcr.io/oblivion-pictures/pulse:vX.Y.Z        (immutable, exact)
#   ghcr.io/oblivion-pictures/pulse:vX.Y          (rolling minor)
#   ghcr.io/oblivion-pictures/pulse:vX            (rolling major)
#   ghcr.io/oblivion-pictures/pulse:sha-<short>   (every build, for forensics)
#
# Trigger options (all do the same build, different tags applied):
#   1. push to main         → :edge + :sha-<short>
#   2. push tag v*.*.*      → :stable + :vX.Y.Z + :vX.Y + :vX + :sha-<short>
#   3. workflow_dispatch    → :edge (no input) or :stable (release_version input)
#
# :stable bewegt sich seit v1.0.0 (Oktober 2026) nur noch mit getaggten
# Releases. Bis dahin taggte jeder main-Push auch :stable (Phasen-Policy vom
# 2026-06-10), damit in der Frühphase alle Self-Hosts jeden Push zogen — seit
# sich jeder ohne Freigabe einen Server installieren kann, bekämen sonst
# fremde Server jeden ungeprüften Stand binnen Minuten.
#
# ARCHITEKTUR (2026-07-15): Multi-Arch NATIV statt QEMU. Drei Jobs:
#   prepare → berechnet Version + Tags einmal zentral.
#   build   → Matrix: amd64 auf ubuntu-24.04, arm64 auf ubuntu-24.04-arm
#             (echte ARM-Maschine, öffentliches Repo = gratis). Beide bauen
#             OHNE Emulation und pushen per Digest (noch ohne Tag), parallel.
#   merge   → klebt die zwei Digests zum Multi-Arch-Manifest unter den echten
#             Tags + spiegelt nach registry.howispulse.com.
# Effekt: Kaltbau von ~90 min (QEMU) auf ~15 min (nativ + parallel). Der frühere
# 180-min-Timeout (für den emulierten arm64-Cold-Build) entfällt.
#
# PFAD-FILTER (2026-07-15): läuft nur, wenn wirklich Image-Inhalt betroffen ist
# (Services/Shared/Web/Plugins/Self-Host-Dockerfile+Adapter/Lockfiles/dieser
# Workflow). Docs-/Desktop-/Packaging-/Mac-Win-Sidecar-Änderungen starten den
# Bau nicht mehr → weniger Läufe, weniger Abbruch-Chaos.

name: allinone

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'web/**'                 # Frontend steckt im allinone-Image!
      - 'desktop/package.json'   # vom Image kopiert (COPY-Zeile im Dockerfile)
      - 'krypto/**'               # Krypto-Kern wird als WASM ins Frontend eingebaut
      - 'plugins/**'
      - 'infra/self-host/**'     # Dockerfile + Rust-Direktpfad-Adapter
      - 'patches/**'             # patchedDependencies — wirken auf Frontend-Bau
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/allinone.yml'
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version like 1.0.0 — leave blank to publish :edge'
        required: false
        default: ''
        type: string

# Edge builds on main cancel each other (only the latest commit matters).
# Tag builds never cancel — every release must finish.
concurrency:
  group: allinone-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/oblivion-pictures/pulse

jobs:
  # ── 1. Version + Tags einmal zentral berechnen ────────────────────────────
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      pulse_version: ${{ steps.meta.outputs.pulse_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version + tags
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail

          SHORT_SHA="$(git rev-parse --short HEAD)"

          # Determine channel + version
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CHANNEL="stable"
            SOURCE="tag push"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            CHANNEL="stable"
            SOURCE="manual dispatch"
          else
            VERSION=""
            CHANNEL="edge"
            SOURCE="branch push / manual dispatch (no version)"
          fi

          # Validate semver for stable releases
          if [[ "$CHANNEL" == "stable" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version '${VERSION}'. Expected semver like 1.0.0 or 1.0.0-rc1."
              exit 1
            fi
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            # Pre-release versions (1.0.0-rc1) only push :vX.Y.Z + :sha — not :stable, :vX.Y, :vX.
            if [[ "$VERSION" == *-* ]]; then
              TAGS=$(printf '%s\n' \
                "${IMAGE}:v${VERSION}" \
                "${IMAGE}:sha-${SHORT_SHA}")
            else
              TAGS=$(printf '%s\n' \
                "${IMAGE}:stable" \
                "${IMAGE}:v${VERSION}" \
                "${IMAGE}:v${MAJOR}.${MINOR}" \
                "${IMAGE}:v${MAJOR}" \
                "${IMAGE}:sha-${SHORT_SHA}")
            fi
          else
            # main-Pushes taggen nur :edge; :stable kommt allein aus Release-Tags
            # (Kopf dieser Datei).
            TAGS=$(printf '%s\n' \
              "${IMAGE}:edge" \
              "${IMAGE}:sha-${SHORT_SHA}")
          fi

          # Pulse-version label baked into the image (shown in /admin/server-info)
          if [[ -n "$VERSION" ]]; then
            PULSE_VERSION="$VERSION"
          else
            PULSE_VERSION="$SHORT_SHA"
          fi

          {
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "pulse_version=$PULSE_VERSION"
            echo "short_sha=$SHORT_SHA"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Building $CHANNEL (source: $SOURCE, version: ${VERSION:-none}, sha: $SHORT_SHA)"
          echo "Tags:"
          echo "$TAGS" | sed 's/^/  - /'

  # ── 2. Pro-Arch nativ bauen + per Digest pushen (parallel) ────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Nativ (kein QEMU) → 60 min reicht mit Abstand, auch cold. Ein Timeout-
    # Abbruch exportiert keinen Cache; das ist bei nativen Läufen aber weit
    # jenseits der realen Dauer.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/self-host/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            PULSE_VERSION=${{ needs.prepare.outputs.pulse_version }}
          labels: |
            org.opencontainers.image.title=Pulse Self-Host
            org.opencontainers.image.description=Pulse all-in-one self-host container (chat + voice + HQ streaming)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.pulse_version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          # Push OHNE Tag, nur per Digest — der merge-Job klebt die Tags drauf.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Cache PRO ARCH getrennt — sonst überschreiben amd64/arm64 sich.
          cache-from: type=gha,scope=allinone-${{ matrix.arch }}
          # ignore-error: der GHA-Cache-Export flaket sporadisch NACH dem Push
          # ("error writing layer blob: not_found"). Cache ist nur Speedup.
          cache-to: type=gha,mode=max,scope=allinone-${{ matrix.arch }},ignore-error=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 3. Multi-Arch-Manifest kleben + spiegeln ──────────────────────────────
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      # Self-Host-allinone-Registry (registry.howispulse.com). Leerer Secret →
      # Mirror-Schritte skippen (GHCR bleibt Source-of-Truth, CI bricht nicht).
      REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest under the real tags
        working-directory: /tmp/digests
        env:
          GHCR_TAGS: ${{ needs.prepare.outputs.tags }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          # -t für jeden Tag, dann alle per-Arch-Digests als Quellen.
          TAG_ARGS=()
          while IFS= read -r t; do [ -n "$t" ] && TAG_ARGS+=(-t "$t"); done <<< "$GHCR_TAGS"
          SRC_ARGS=()
          for d in *; do [ -f "$d" ] && SRC_ARGS+=("${IMAGE}@sha256:${d}"); done
          echo "::notice::Manifest aus ${#SRC_ARGS[@]} Arch(en) unter $(( ${#TAG_ARGS[@]} / 2 )) Tag(s)"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SRC_ARGS[@]}"

      # --- Mirror zur Self-Host-Registry (best-effort) ──────────────────────────
      # GHCR oben ist Source-of-Truth (MUST grün). Zusätzlich wird das Multi-Arch-
      # Manifest (amd64+arm64) nach registry.howispulse.com kopiert — dort pullen
      # Self-Host-User mit per-Instance-Credentials. ``imagetools create`` kopiert
      # Manifest+Blobs OHNE Rebuild. continue-on-error: bei netcup-Ausfall bleiben
      # die GHCR-Tags trotzdem aktuell.
      # Mit Wiederholung, und der Grund ist hausgemacht: der Token-Endpunkt für
      # diese Registry liegt hinter howispulse.com (auth-svc), und derselbe
      # main-Push, der diesen Workflow auslöst, baut auch die Cloud-Images. Der
      # Update-Cron auf dem Server zieht sie im Zwei-Minuten-Takt und erneuert
      # die Container — wer genau dann ein Token holen will, bekommt 502 vom
      # Proxy. Am 2026-07-27 ist der erste Lauf nach dem Merge exakt daran
      # gescheitert (`dial tcp …:80: connection refused` in Caddys Log), während
      # Registry und Spiegel völlig in Ordnung waren.
      #
      # Bewusst als Schleife in der Shell statt über eine Retry-Action: das wäre
      # eine weitere Fremd-Action in der Lieferkette für fünf Zeilen bash. Das
      # Secret kommt über die Umgebung und `--password-stdin`, landet also nicht
      # in der Kommandozeile.
      - name: Login to self-hosted registry
        if: ${{ env.REGISTRY_PUSH_TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          for versuch in 1 2 3 4 5; do
            if printf '%s' "$TOKEN" \
               | docker login registry.howispulse.com -u pulse-ci --password-stdin; then
              exit 0
            fi
            echo "::warning::Login-Versuch ${versuch} fehlgeschlagen — 30 s warten (laeuft gerade ein Deploy?)"
            sleep 30
          done
          echo "::error::Login an registry.howispulse.com nach 5 Versuchen fehlgeschlagen."
          exit 1

      # KEIN continue-on-error mehr (2026-07-27). Vorher wurde ein Spiegel-
      # Fehler doppelt verschluckt — `continue-on-error` plus `|| exit 0` —, der
      # Workflow blieb gruen und niemand erfuhr davon. Zu diesem Zeitpunkt sind
      # die GHCR-Tags bereits gesetzt (Schritt oben), ein Fehlschlag hier
      # gefaehrdet sie also nicht; er soll nur SICHTBAR sein. Ein kaputter
      # Spiegel faellt sonst erst beim Self-Hoster auf, und genau das ist am
      # 2026-07-26 passiert (s. infra/prod/DEPLOY.md, GC-Cron).
      - name: Mirror to registry.howispulse.com
        if: ${{ env.REGISTRY_PUSH_TOKEN != '' }}
        env:
          GHCR_TAGS: ${{ needs.prepare.outputs.tags }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          SRC="${IMAGE}:sha-${SHORT_SHA}"
          # Registry-Tags aus den GHCR-Tags ableiten (nur der Image-Prefix ändert
          # sich; die Tags selbst bleiben identisch). Der Spiegelname bleibt
          # ``pulse-allinone``, obwohl das GHCR-Bild seit dem Umzug in die
          # Organisation ``pulse`` statt ``pulse-allinone`` heisst: die
          # Bestandsserver ziehen ihn, und
          # auth-svc erzwingt ihn (routes_registry_auth.py). Stimmt das Muster
          # nicht, bliebe REG_TAGS gleich GHCR_TAGS und der Spiegel verhungerte
          # still — deshalb die Prüfung direkt danach.
          REG_TAGS="$(printf '%s\n' "${GHCR_TAGS}" \
            | sed "s|^${IMAGE}:|registry.howispulse.com/pulse-allinone:|")"
          case "$REG_TAGS" in
            *registry.howispulse.com/pulse-allinone:*) ;;
            *) echo "::error::Spiegel-Tags nicht abgeleitet: $REG_TAGS"; exit 1 ;;
          esac
          ARGS=()
          while IFS= read -r t; do [ -n "$t" ] && ARGS+=(-t "$t"); done <<< "$REG_TAGS"
          TAG_COUNT=$(( ${#ARGS[@]} / 2 ))
          echo "::notice::Mirror ${TAG_COUNT} tag(s) → registry.howispulse.com"
          echo "Source: $SRC"
          echo "$REG_TAGS" | sed '/^$/d; s/^/  → /'
          docker buildx imagetools create "${ARGS[@]}" "$SRC"

          # NACHPRUEFEN, nicht hoffen. `imagetools create` kann den Index
          # schreiben und trotzdem unvollstaendig sein — dann loest der Tag auf,
          # der Pull scheitert aber am fehlenden Kind-Manifest ("content at
          # .../manifests/sha256:... not found"). Genau dieses Fehlerbild hatte
          # ein Self-Hoster am 2026-07-27, damals durch den GC ausgeloest.
          # Beide Architekturen muessen aufloesen, sonst ist der Spiegel kaputt.
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "Pruefe $t"
            OUT="$(docker buildx imagetools inspect "$t")" || {
              echo "::error::Spiegel $t laesst sich nicht aufloesen"; exit 1; }
            for arch in amd64 arm64; do
              printf '%s\n' "$OUT" | grep -q "linux/${arch}" || {
                echo "::error::Spiegel $t hat kein linux/${arch}"; exit 1; }
            done
          done <<< "$REG_TAGS"
          echo "::notice::Spiegel geprueft — alle Tags loesen mit amd64+arm64 auf."
