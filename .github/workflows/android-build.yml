name: android-build

# Baut die Android-APK (Capacitor-Wrapper um howispulse.com, com.howispulse.app)
# und stellt sie bereit: immer als Workflow-Artefakt (Debug), und falls die
# Keystore-Secrets gesetzt sind zusaetzlich als signierte Release-APK per scp auf
# den Cloud-VPS unter https://howispulse.com/downloads/. Gleiches SSH-Deploy-Muster
# wie win-build.yml / flatpak.yml (selbe VPS-Secrets).
#
# Der Wrapper laedt das Web-Frontend remote (server.url = howispulse.com/app), die
# APK buendelt KEINE Web-Assets — nur native AEnderungen (z.B. SpeakerphoneRouter)
# brauchen einen Rebuild. Laeuft bei main-Pushes, die mobile/ beruehren.
#
# Signieren und Veroeffentlichen NUR von main (2026-10-12): ein workflow_dispatch
# laesst sich auf jedem Zweig starten und sieht dort dieselben Secrets (Keystore,
# VPS-Zugang) — er haette eine signierte APK unter /downloads/pulse-latest.apk
# ablegen koennen. Auf einem anderen Zweig entsteht deshalb nur die Debug-APK
# als Artefakt, die Schluessel werden nicht einmal angefasst.
# Grenze: die Bedingung steht im Workflow selbst — wer ihn auf einem eigenen
# Zweig aendern kann, umgeht sie; dagegen helfen nur Repo-Einstellungen
# (Environment mit „Deployment branches: main“ fuer die Secrets).

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # contents:write für den GitHub-Release-Schritt (infra/release/github-release.sh).
    # Der Workflow läuft nur auf main-Pushes und workflow_dispatch, nie für PRs.
    permissions:
      contents: write
    # secrets duerfen nicht direkt in step-if stehen -> hier auf einen env-Flag
    # mappen und unten darauf pruefen.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Capacitor 8 verlangt JDK 21 (JDK 17 -> "invalid source release: 21").
      - name: JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # v4 noetig seit Google das Legacy-'tools'-Paket aus dem SDK-Repo entfernt
      # hat — v3 stirbt im Setup an 'Failed to find package tools' (fixt in
      # setup-android v4.0.2, 2026-09-17).
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # cap sync schreibt die capacitor.config + Plugin-Verdrahtung nach
      # android/. Braucht die mobile/-Dependencies. Best-effort: bei einem reinen
      # nativen Fix ist das android/-Verzeichnis schon konsistent, aber sync haelt
      # es robust gegen kuenftige Plugin-/Config-AEnderungen.
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Capacitor sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Debug-APK bauen
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Debug-APK als Workflow-Artefakt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pulse-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # --- Optionaler signierter Release-Pfad (nur wenn Keystore-Secrets da) ---
      # Setze die vier Secrets, um eine signierte Release-APK zu erzeugen + zu
      # veroeffentlichen. Ohne sie wird dieser Block uebersprungen.
      # Alles Folgende (scp, GitHub-Release) haengt an steps.release.
      - name: Release-APK bauen + signieren
        id: release
        if: ${{ env.HAS_KEYSTORE == 'true' && github.ref == 'refs/heads/main' }}
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          ./gradlew assembleRelease --no-daemon --stacktrace
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/pulse-release-aligned.apk
          "$BT/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign --ks /tmp/release.keystore \
            --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" --out /tmp/pulse-release.apk "$ALIGNED"
          rm -f /tmp/release.keystore

      - name: SSH fuer scp einrichten
        if: ${{ steps.release.conclusion == 'success' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      # Stabiler Direktdownload: https://howispulse.com/downloads/pulse-latest.apk
      - name: Release-APK nach howispulse hochladen
        if: ${{ steps.release.conclusion == 'success' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          scp -i ~/.ssh/id_ed25519 /tmp/pulse-release.apk \
            ${{ secrets.VPS_SSH_ZIEL }}:pulse/downloads/pulse-latest.apk

      # Zusätzlich als GitHub-Release (Schritt 1 des Download-Umzugs auf GitHub,
      # 2026-10-12): ein Release je Version, feste Dateinamen — Mechanik im Kopf
      # von infra/release/github-release.sh. netcup bleibt vorerst die Quelle für
      # die Links; dieser Schritt läuft danach, ein Fehler hier färbt
      # den Lauf rot, ohne den Feed zu berühren.
      # Die APK landet im Release der aktuellen DESKTOP-Version — so liegen alle
      # Downloads in einem Release, und `releases/latest/download/Pulse-Android.apk`
      # trifft immer die neueste.
      - name: Release-APK auf GitHub Releases veröffentlichen
        if: ${{ steps.release.conclusion == 'success' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash infra/release/github-release.sh "$(node -p "require('./desktop/package.json').version")" \
            "Pulse-Android.apk=/tmp/pulse-release.apk"

      - name: SSH-Key entfernen
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
